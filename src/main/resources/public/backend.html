<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Backend – Rechnungsläufe</title>
    <link rel="stylesheet" href="stil.css">
</head>
<body class="backend">
<header>
    <h1>Backend</h1>
    <nav>
        <a href="portal.html">Kundenportal</a>
        <a href="backend.html" aria-current="page">Backend</a>
        <a href="km.html">Kundenmanagement</a>
    </nav>
</header>
<main>
    <section>
        <h2>Rechnungslauf</h2>
        <div class="zeile">
            <button id="neuer-lauf">Neuen Rechnungslauf anlegen</button>
            <button id="lauf-starten" disabled>Rechnungslauf starten</button>
            <button id="lauf-freigeben" disabled>Rechnungslauf freigeben</button>
        </div>
        <p class="hinweis">
            Lauf <span id="lauf-id" class="wert">–</span>,
            Status <span id="lauf-status" class="wert">–</span>,
            Rechnungen <span id="lauf-rechnungen" class="wert">–</span>
        </p>
        <p class="hinweis">Starten und Freigeben laufen im Hintergrund. Der Status aktualisiert sich selbst.</p>
    </section>
    <p id="fehler" class="fehler" role="alert"></p>
</main>
<script src="gemeinsam.js"></script>
<script>
    // Der Tab merkt sich den Lauf, damit er nach einem Seitenwechsel noch da ist.
    let laufId = sessionStorage.getItem("lauf");

    function zeigeLauf(lauf) {
        laufId = lauf.id;
        sessionStorage.setItem("lauf", laufId);
        document.getElementById("lauf-id").textContent = lauf.id;
        document.getElementById("lauf-status").textContent = lauf.status;
        document.getElementById("lauf-rechnungen").textContent = lauf.anzahlRechnungen;
        document.getElementById("lauf-starten").disabled = lauf.status !== "ANGELEGT";
        document.getElementById("lauf-freigeben").disabled = lauf.status !== "BUCHUNGSBEREIT";
    }

    beiKlick("neuer-lauf", async () => zeigeLauf(await api("POST", "/api/rechnungslaeufe")));
    beiKlick("lauf-starten", async () => zeigeLauf(await api("POST", `/api/rechnungslaeufe/${laufId}/start`)));
    beiKlick("lauf-freigeben", async () => zeigeLauf(await api("POST", `/api/rechnungslaeufe/${laufId}/freigabe`)));

    alleSekunde(async () => {
        if (laufId) {
            zeigeLauf(await api("GET", `/api/rechnungslaeufe/${laufId}`));
        }
    });
</script>
</body>
</html>
