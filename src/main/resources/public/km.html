<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kundenmanagement</title>
    <link rel="stylesheet" href="stil.css">
</head>
<body class="km">
<header>
    <h1>Kundenmanagement</h1>
    <nav>
        <a href="portal.html">Kundenportal</a>
        <a href="backend.html">Backend</a>
        <a href="km.html" aria-current="page">Kundenmanagement</a>
    </nav>
</header>
<main>
    <section>
        <h2>Eingegangene Korrespondenz erfassen</h2>
        <div class="zeile">
            <label>Kundennummer <input id="korr-kundennummer"></label>
            <label>Rechnungsnummer <input id="korr-rechnungsnummer"></label>
            <button id="korrespondenz-senden">An Tasklist Abrechnungen senden</button>
        </div>
    </section>

    <section>
        <h2>Tasklist Abrechnungen</h2>
        <table>
            <thead><tr><th>Vorgang</th><th>Kunde</th><th>Rechnung</th><th>Status</th><th></th></tr></thead>
            <tbody id="tasklist"></tbody>
        </table>
    </section>

    <section id="vorgang" hidden>
        <h2>Reklamation <span id="vorgang-id"></span></h2>
        <div class="zeile">
            <label>Ergebnis
                <select id="ergebnis">
                    <option value="VOLLSTORNO">Vollstorno</option>
                    <option value="ABGELEHNT">Abgelehnt</option>
                </select>
            </label>
            <button id="reklamation-anlegen">Reklamation entscheiden</button>
        </div>
        <p class="hinweis">Vorgangsstatus: <span id="vorgang-status" class="wert">–</span></p>
        <h2>Rechnungen des Kunden</h2>
        <table>
            <thead><tr><th>Nummer</th><th>Art</th><th>Status</th><th class="betrag">Betrag</th></tr></thead>
            <tbody id="kunden-rechnungen"></tbody>
        </table>
    </section>
    <p id="fehler" class="fehler" role="alert"></p>
</main>
<script src="gemeinsam.js"></script>
<script>
    let offen = null;

    function taskZeile(korrespondenz) {
        const tr = document.createElement("tr");
        tr.dataset.id = korrespondenz.id;
        const knopf = document.createElement("button");
        knopf.textContent = "Öffnen";
        knopf.className = "oeffnen";
        knopf.addEventListener("click", () => vorgangOeffnen(korrespondenz));
        const aktion = document.createElement("td");
        aktion.append(knopf);
        tr.append(zelle(korrespondenz.id), zelle(korrespondenz.kundennummer),
            zelle(korrespondenz.rechnungsnummer), zelle(korrespondenz.status, "status"), aktion);
        return tr;
    }

    function vorgangOeffnen(korrespondenz) {
        offen = korrespondenz;
        document.getElementById("vorgang").hidden = false;
        document.getElementById("vorgang-id").textContent = korrespondenz.id;
    }

    beiKlick("korrespondenz-senden", () => api("POST", "/api/korrespondenzen", {
        kundennummer: document.getElementById("korr-kundennummer").value,
        rechnungsnummer: document.getElementById("korr-rechnungsnummer").value
    }));

    beiKlick("reklamation-anlegen", () => api("POST", `/api/korrespondenzen/${offen.id}/reklamation`,
        { ergebnis: document.getElementById("ergebnis").value }));

    alleSekunde(async () => {
        const tasks = await api("GET", "/api/tasklists/abrechnungen");
        tabelleAktualisieren(document.getElementById("tasklist"), tasks, taskZeile);
        if (offen) {
            // Erst den Vorgang, dann die Rechnungen laden, aber den Status zuletzt anzeigen:
            // Steht dort ERLEDIGT, zeigt die Tabelle schon das Ergebnis der Reklamation.
            const stand = await api("GET", `/api/korrespondenzen/${offen.id}`);
            const rechnungen = await api("GET", `/api/kunden/${offen.kundennummer}/rechnungen`);
            tabelleAktualisieren(document.getElementById("kunden-rechnungen"), rechnungen, rechnungsZeile);
            document.getElementById("vorgang-status").textContent = stand.status;
        }
    });
</script>
</body>
</html>
